[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shotlab-cli"
version = "0.1.0"
description = "Shotlab 3D Studio & ComfyUI Render CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
shotlab = "cli.main:app"
